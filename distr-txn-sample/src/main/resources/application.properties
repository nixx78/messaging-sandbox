activemq.broker-url=tcp://localhost:61616
activemq.user=admin
activemq.password=admin

event.queue.name=event.queue

spring.datasource.url=jdbc:mysql://localhost:3306/db_txn_sandbox?useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=DBSandboxPool

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.transaction.jta.platform=AtomikosJtaPlatform
spring.jpa.transaction-type=JTA

spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=validate

logging.level.com.atomikos=DEBUG
spring.jta.atomikos.log-base-dir=target/transaction-logs
spring.jta.transaction-manager-id=myAtomikosTM