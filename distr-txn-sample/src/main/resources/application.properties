spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

event.queue.name=event.queue

spring.datasource.url=jdbc:mysql://localhost:3306/db_txn_sandbox?useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=DBSandboxPool

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.hibernate.ddl-auto=validate

logging.level.com.atomikos=DEBUG
spring.jta.transaction-manager-id=myAtomikosTM

server.error.include-message=always